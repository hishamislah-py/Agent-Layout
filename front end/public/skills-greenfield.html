<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Catalog — Client Onboarding Portal</title>
<meta name="description" content="The 12 capability skills of the Client Onboarding Portal AI pipeline — each with capabilities, mechanics, output schema, evaluation criteria, and specs.">

<style>
  :root {
    --ink:#0B0B0D; --ink-2:#111218; --surface:#15171F; --surface-2:#1B1E27;
    --line:#2B2E38; --line-soft:#20222B; --text:#E7E3D6; --muted:#A6A296; --faint:#6E6A5E;
    --accent:#F2C94C; --accent-2:#F7DC84; --accent-dim:rgba(242,201,76,.13); --accent-line:rgba(242,201,76,.30); --glow:rgba(242,201,76,.06);
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;
    --maxw:1060px; --step:clamp(2.4rem,6vw,4.5rem);
  }
  * { box-sizing: border-box; }
  body {
    margin:0;
    background: radial-gradient(120% 80% at 80% -10%, var(--glow), transparent 55%), var(--ink);
    color:var(--text); font-family:var(--font-sans); font-size:17px; line-height:1.6;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; transition:background .4s ease;
  }
  ::selection { background:var(--accent-dim); color:var(--accent-2); }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  a { color:var(--accent-2); text-decoration:none; }
  a:hover { text-decoration:underline; text-underline-offset:3px; }

  .eyebrow { font-family:var(--font-mono); font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin:0; }
  .label { font-family:var(--font-mono); font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); }
  h1,h2,h3 { text-wrap:balance; font-weight:650; letter-spacing:-.02em; line-height:1.08; }
  .mono { font-family:var(--font-mono); }

  .topbar { border-bottom:1px solid var(--line-soft); position:sticky; top:0; z-index:20; background:rgba(11,11,13,.82); backdrop-filter:blur(10px); }
  .topbar .wrap { display:flex; align-items:center; justify-content:space-between; height:56px; }
  .brand { display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:.8rem; letter-spacing:.04em; color:var(--muted); }
  .brand b { color:var(--text); font-weight:600; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); transition:background .4s ease, box-shadow .4s ease; }
  .topbar nav { display:flex; gap:22px; }
  .topbar nav a { color:var(--muted); font-family:var(--font-mono); font-size:.74rem; letter-spacing:.04em; }
  .topbar nav a:hover { color:var(--text); text-decoration:none; }
  @media (max-width:760px){ .topbar nav { display:none; } }

  .pipeline { border-bottom:1px solid var(--line-soft); background:var(--ink-2); }
  .pipeline .wrap { display:flex; align-items:center; gap:4px; overflow-x:auto; padding-top:12px; padding-bottom:12px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .pipeline .wrap::-webkit-scrollbar { height:5px; }
  .pipeline .wrap::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  .stage { display:inline-flex; align-items:baseline; gap:8px; white-space:nowrap; font-family:var(--font-mono); font-size:.76rem; color:var(--faint); padding:5px 11px; border-radius:999px; border:1px solid transparent; cursor:pointer; background:none; transition:color .15s ease, background .15s ease, border-color .15s ease; }
  .stage:hover { color:var(--text); }
  .stage .s-n { font-size:.66rem; opacity:.8; }
  .stage.active { color:var(--text); border-color:var(--accent-line); background:var(--accent-dim); }
  .stage.active .s-n { color:var(--accent); opacity:1; }
  .stage.done { color:var(--muted); }
  .arr { color:var(--line); font-family:var(--font-mono); font-size:.7rem; }

  .hero { padding:var(--step) 0 calc(var(--step) * .7); }
  .hero-grid { display:grid; grid-template-columns:1.05fr .95fr; gap:48px; align-items:center; }
  @media (max-width:920px){ .hero-grid { grid-template-columns:1fr; gap:36px; } }
  .hero h1 { font-size:clamp(2.4rem,5.8vw,3.9rem); margin:16px 0 0; }
  .hero-status { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .pill { font-family:var(--font-mono); font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; padding:3px 9px; border-radius:5px; border:1px solid var(--line); color:var(--muted); background:var(--surface); }
  .pill.accent { color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim); }
  .hero .lede { color:var(--muted); font-size:1.1rem; max-width:48ch; margin:18px 0 0; }
  .hero-meta { display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:26px; font-family:var(--font-mono); font-size:.76rem; color:var(--muted); }
  .hero-meta span b { color:var(--text); font-weight:600; }

  .scanner { position:relative; border:1px solid var(--line); border-radius:10px; background:linear-gradient(180deg,var(--surface),var(--ink-2)); overflow:hidden; box-shadow:0 24px 60px -30px rgba(0,0,0,.8); }
  .scanner-head { display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--line-soft); font-family:var(--font-mono); font-size:.71rem; color:var(--faint); }
  .tl { display:flex; gap:6px; margin-right:6px; }
  .tl i { width:9px; height:9px; border-radius:50%; background:var(--line); display:block; }
  .scan-body { position:relative; }
  pre.code { margin:0; padding:18px 18px 20px; font-family:var(--font-mono); font-size:.77rem; line-height:1.7; color:#aeb9c5; overflow-x:auto; tab-size:2; }
  pre.code .k { color:#ffd86b; } pre.code .s { color:#88c9a1; } pre.code .c { color:#56616e; font-style:italic; }
  pre.code .f { color:#e4d290; } pre.code .n { color:#d8a0d8; } pre.code .x { color:#ff7a7a; }

  .scanline { position:absolute; left:0; right:0; top:0; height:38px; background:linear-gradient(180deg,transparent,var(--accent-dim) 70%,var(--accent-line)); border-bottom:1px solid var(--accent); box-shadow:0 0 22px 2px var(--accent-dim); pointer-events:none; animation:sweep 5.6s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes sweep { 0%{transform:translateY(-40px);opacity:0;} 8%{opacity:1;} 70%{opacity:1;} 85%{transform:translateY(300px);opacity:0;} 100%{transform:translateY(300px);opacity:0;} }

  .findings { border-top:1px solid var(--line-soft); padding:14px; display:flex; flex-direction:column; gap:8px; background:var(--ink-2); }
  .finding { display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:.72rem; padding:8px 11px; border-radius:7px; border:1px solid var(--line-soft); background:var(--surface); opacity:0; transform:translateX(8px); animation:pop .5s ease forwards; }
  .finding .tag { font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; padding:2px 7px; border-radius:4px; color:var(--ink); background:var(--accent); font-weight:700; flex-shrink:0; }
  .finding .tag.alt { background:transparent; color:var(--accent); border:1px solid var(--accent-line); }
  .finding .txt { color:var(--text); }
  .finding .meta { margin-left:auto; color:var(--faint); flex-shrink:0; }
  .finding:nth-child(1){ animation-delay:1.0s; } .finding:nth-child(2){ animation-delay:1.5s; }
  .finding:nth-child(3){ animation-delay:2.0s; } .finding:nth-child(4){ animation-delay:2.5s; }
  @keyframes pop { to { opacity:1; transform:translateX(0); } }

  @media (prefers-reduced-motion:reduce) { .scanline{ animation:none; opacity:.85; top:110px; } .finding{ animation:none; opacity:1; transform:none; } body,.dot{ transition:none; } }

  .section { padding:calc(var(--step) * .72) 0; border-top:1px solid var(--line-soft); }
  .section-head { max-width:56ch; margin-bottom:34px; }
  .section-head h2 { font-size:clamp(1.6rem,3.2vw,2.3rem); margin:12px 0 0; }
  .section-head p { color:var(--muted); margin:14px 0 0; }
  .prose p { color:var(--muted); max-width:64ch; margin:0 0 16px; }
  .prose strong { color:var(--text); font-weight:600; }

  .cap-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; }
  @media (max-width:820px){ .cap-grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:540px){ .cap-grid { grid-template-columns:1fr; } }
  .cap { background:var(--surface); padding:20px 20px 22px; display:flex; flex-direction:column; gap:8px; transition:background .18s ease; }
  .cap:hover { background:var(--surface-2); }
  .cap .cap-id { font-family:var(--font-mono); font-size:.68rem; color:var(--accent); letter-spacing:.08em; }
  .cap h3 { font-size:1rem; margin:0; }
  .cap p { margin:0; color:var(--muted); font-size:.88rem; line-height:1.5; }

  .steps { display:flex; flex-direction:column; }
  .step { display:grid; grid-template-columns:56px 1fr; gap:20px; padding:20px 0; border-top:1px solid var(--line-soft); }
  .step:first-child { border-top:none; }
  .step .st-n { font-family:var(--font-mono); font-size:1.4rem; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1; padding-top:2px; }
  .step h3 { font-size:1.05rem; margin:0 0 6px; }
  .step p { margin:0; color:var(--muted); font-size:.93rem; max-width:62ch; }

  .schema { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (max-width:720px){ .schema { grid-template-columns:1fr; } }
  .field { border:1px solid var(--line-soft); border-radius:9px; padding:14px 16px; background:var(--surface); display:flex; flex-direction:column; gap:5px; }
  .field .fname { font-family:var(--font-mono); font-size:.84rem; color:var(--text); }
  .field .fname .br { color:var(--accent); }
  .field .fdesc { font-size:.84rem; color:var(--muted); }

  .conf { margin-top:24px; border:1px solid var(--accent-line); border-radius:10px; background:var(--accent-dim); padding:16px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .conf .meter { display:flex; gap:4px; }
  .conf .seg { width:24px; height:10px; border-radius:2px; background:var(--line); }
  .conf .seg.on { background:var(--accent); }
  .conf .conf-txt { font-family:var(--font-mono); font-size:.78rem; color:var(--muted); }
  .conf .conf-txt b { color:var(--text); }

  .esc-list { display:flex; flex-direction:column; gap:8px; }
  .esc-row { border-left:2px solid var(--accent); background:var(--surface); border-radius:0 8px 8px 0; padding:12px 16px; font-size:.9rem; color:var(--text); }
  .esc-row .to { color:var(--accent); font-family:var(--font-mono); font-weight:700; }
  .esc-note { margin-top:18px; color:var(--faint); font-size:.85rem; max-width:72ch; }
  .esc-note code { color:var(--muted); font-family:var(--font-mono); }

  .principles { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  @media (max-width:720px){ .principles { grid-template-columns:1fr; } }
  .principle { border-top:2px solid var(--accent); padding-top:14px; }
  .principle h3 { font-size:1rem; margin:0 0 7px; }
  .principle p { margin:0; color:var(--muted); font-size:.89rem; }

  .specs { border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; }
  .spec-row { display:grid; grid-template-columns:200px 1fr; border-top:1px solid var(--line-soft); }
  .spec-row:first-child { border-top:none; }
  .spec-row dt { padding:13px 18px; background:var(--ink-2); font-family:var(--font-mono); font-size:.74rem; letter-spacing:.03em; color:var(--muted); }
  .spec-row dd { margin:0; padding:13px 18px; color:var(--text); font-family:var(--font-mono); font-size:.8rem; word-break:break-word; }
  @media (max-width:560px){ .spec-row { grid-template-columns:1fr; } .spec-row dd { padding-top:0; } }

  .next { border-top:1px solid var(--line-soft); padding:var(--step) 0; }
  .next-card { display:flex; align-items:center; justify-content:space-between; gap:20px; border:1px solid var(--line); border-radius:12px; padding:22px 26px; background:var(--surface); flex-wrap:wrap; }
  .next-card .nx-l .label { display:block; margin-bottom:6px; }
  .next-card h3 { font-size:1.3rem; margin:0; }
  .next-card button.go { font-family:var(--font-mono); font-size:.82rem; color:var(--accent); border:1px solid var(--accent-line); border-radius:8px; padding:11px 18px; background:var(--accent-dim); cursor:pointer; transition:background .15s ease; }
  .next-card button.go:hover { background:var(--accent-line); }

  footer.foot { border-top:1px solid var(--line-soft); padding:26px 0 48px; color:var(--faint); font-family:var(--font-mono); font-size:.72rem; }
  footer.foot .wrap { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }

  .fade { animation:fadein .35s ease; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="dot"></span> Onboarding&nbsp;Portal&nbsp;<b>· Skill Catalog</b></div>
    <nav>
      <a href="/toolkit">Back to Engineering Agents</a>
      <a href="#what">Overview</a>
      <a href="#caps">Capabilities</a>
      <a href="#how">Mechanics</a>
      <a href="#output">Output</a>
      <a href="#specs">Specs</a>
    </nav>
  </div>
</header>

<div class="pipeline"><div class="wrap" id="switcher"></div></div>

<main id="app"></main>

<footer class="foot">
  <div class="wrap">
    <span>Generated from ai/skills/*/SKILL.md + ai/REGISTRY.md · all skills v0.1.0 draft / built-from-scratch</span>
    <span id="foot-pos">Skill 01 / 12</span>
  </div>
</footer>

<script>
/* ---------- category accents (collapsed to the yellow skill theme) ---------- */
const YELLOW = "#F2C94C", YELLOW2 = "#F7DC84";
const CATS = {
  gen:    { label: "Generation",    accent: YELLOW, accent2: YELLOW2 },
  review: { label: "Review",        accent: YELLOW, accent2: YELLOW2 },
  reason: { label: "Reasoning",     accent: YELLOW, accent2: YELLOW2 },
  docs:   { label: "Documentation", accent: YELLOW, accent2: YELLOW2 },
};

const ORDER = [
  "backend-generation","frontend-generation","workflow-engine","dynamic-form-engine",
  "xlsx-processing","rbac-implementation","architecture-review","reviewer",
  "security-review","audit-engine","state-machine","documentation"
];

const SKILLS = {

"backend-generation": {
  num:"01", short:"Backend", name:"Backend Generation", cat:"gen", runtime:true,
  lede:"It scaffolds a feature inside one bounded context the way a service owner would — entities with behavior, use cases, handlers and events — and ships the authorization, in-transaction audit, and the full negative-path test matrix as part of the same output.",
  meta:[["Inputs","feature spec + module"],["Output","files + tests"],["Invoked by","backend-agent"]],
  specimen:{ file:"spec: create_case use case → generate", code:
`<span class="k">export async function</span> <span class="f">createCase</span>(cmd, ctx) {
  authz.<span class="f">assertCan</span>(ctx.actor, <span class="s">"case.create"</span>, null)
  <span class="k">return</span> <span class="f">tx</span>(<span class="k">async</span> (t) =&gt; {        <span class="c">// generated</span>
    <span class="k">const</span> c = Case.<span class="f">open</span>(cmd, ctx.actor)
    <span class="k">await</span> repo.<span class="f">save</span>(c, t)
    <span class="k">await</span> outbox.<span class="f">emit</span>(CaseOpened, t)  <span class="c">// audit</span>
  })
}`,
    findings:[
      {tag:"Gen",alt:false,txt:"5 files generated",meta:"FILES"},
      {tag:"Gen",alt:false,txt:"assertCan + audit in tx",meta:"SAFE"},
      {tag:"Test",alt:true,txt:"happy · bad actor · idempotent",meta:"5 CASES"},
      {tag:"Flag",alt:true,txt:"migration? → escalate",meta:"DB"} ] },
  overview:[
    "Given a feature spec and a target module, the Backend Generation skill produces the code for one bounded context — domain entities with behavior, use cases, repositories, HTTP handlers, jobs, events — together with the tests. It is the capability the <strong>backend-agent</strong> reaches for when implementing a feature.",
    "Three guarantees are baked in: every state-changing endpoint calls the central <strong>AuthorizationService</strong>, every state change emits a domain event and an audit record inside the same transaction, and the test matrix covers the negative paths. Schema migrations are emitted but flagged for escalation."],
  caps:[
    ["entities","Domain entities","Entities with behavior, plus use cases and repositories."],
    ["handlers","Handlers & jobs","HTTP endpoints and background jobs for the feature."],
    ["events","Events & audit","Domain events on the outbox; audit emitted in-transaction."],
    ["authz","Authorization","assertCan at every state-changing endpoint."],
    ["tests","Test matrix","Happy, invalid actor, invalid precondition, idempotency, audit."],
    ["migrations","Migrations (flagged)","DB migration files, flagged for escalation."]],
  steps:[
    ["Receives a spec","Takes a feature spec + target module within one bounded context."],
    ["Loads context","Architecture, engineering, rbac, security, and testing guidelines."],
    ["Generates the layers","Entities, use cases, repos, handlers, jobs, and events."],
    ["Wires safety & tests","Authz, in-transaction audit, and the five-case test matrix."],
    ["Emits the diff","Files + events + audit events + a PR-ready summary."]],
  output:[
    ["files",false,"Created / modified files with full paths."],
    ["events",false,"New domain events emitted."],
    ["audit_events",true,"New audit events emitted."],
    ["migrations",true,"DB migration files (flagged)."],
    ["tests",false,"Test files alongside the code."],
    ["diff_summary",false,"PR-ready summary."]],
  gate:"Generated code must pass tsc/mypy, ESLint/Ruff, dependency-cruiser and the full test matrix; coverage delta ≥ 0.",
  evaluation:[
    "Passes tsc/mypy, ESLint/Ruff, dependency-cruiser, naming checks.",
    "assertCan at every state-changing endpoint.",
    "Audit event emitted within the transaction; subscriber wired.",
    "Tests cover happy, invalid actor, invalid precondition, idempotency, audit.",
    "No god classes, inline RBAC, sync notifications, or magic strings."],
  principles:[
    ["Layered, always","interfaces → application → domain → infrastructure; no cross-module imports."],
    ["Safety in the transaction","Authz at the door, audit inside the tx."],
    ["Tests are part of the code","The negative-path matrix ships with the feature."]],
  specs:[
    ["Skill type","Generation"],["Version","0.1.0"],
    ["Status","draft · runtime-wired (.claude/skills)"],["Source","built-from-scratch"],
    ["Invoked by","backend-agent"],
    ["Triggers","apps/api/** · 'new endpoint' · 'new use case'"],
    ["Required context","architecture · engineering · rbac · security · testing guidelines"],
    ["Output","code generation (no envelope)"]]
},

"frontend-generation": {
  num:"02", short:"Frontend", name:"Frontend Generation", cat:"gen", runtime:false,
  lede:"It generates a feature slice the way a design-system-disciplined engineer would — every template through the form engine, every color a token, every permission read from the server, and accessibility asserted in the tests it writes.",
  meta:[["Inputs","spec + API contract"],["Output","components + a11y"],["Invoked by","frontend-agent"]],
  specimen:{ file:"spec: case section nav → generate", code:
`<span class="k">export function</span> <span class="f">SectionNav</span>({ sections }) {
  <span class="k">const</span> { can } = <span class="f">usePermissions</span>()   <span class="c">// server</span>
  <span class="k">return</span> (
    &lt;<span class="f">FormEngine</span>
      template={tpl}               <span class="c">// form-engine-core</span>
      tone={tokens.color.surface}  <span class="c">// token</span>
    /&gt;
  )
}`,
    findings:[
      {tag:"Gen",alt:false,txt:"component + hook",meta:"FILES"},
      {tag:"Gen",alt:false,txt:"form-engine-core used",meta:"ENGINE"},
      {tag:"Test",alt:true,txt:"axe-core: 0 violations",meta:"A11Y"},
      {tag:"Gen",alt:true,txt:"Storybook story",meta:"STORY"} ] },
  overview:[
    "The Frontend Generation skill produces React components, hooks, and form-engine bindings within a single feature slice, applying design tokens and consuming server-supplied permissions. It includes component tests, a11y assertions, and Storybook stories for design-system components.",
    "It never invents authorization rules client-side and never hand-rolls rendering for template-driven content — that always goes through <strong>form-engine-core</strong>. The <strong>frontend-agent</strong> invokes it to render a slice against an API contract."],
  caps:[
    ["components","Components & hooks","PascalCase components, use* hooks, typed props."],
    ["forms","Form-engine bindings","Template-driven UI via form-engine-core."],
    ["tokens","Design tokens","No hardcoded colors or spacing."],
    ["rbac","Server-driven gates","Permissions consumed from the server, not invented."],
    ["a11y","Accessibility tests","axe-core assertions; query by role / label."],
    ["stories","Storybook","Stories for design-system components."]],
  steps:[
    ["Receives a spec","Feature spec + API contract + target slice."],
    ["Loads context","Engineering guidelines, rbac-rules, and the glossary."],
    ["Generates UI","Components, hooks, and form-engine bindings, styled with tokens."],
    ["Asserts quality","Component, a11y, and (where relevant) Storybook tests."],
    ["Emits the diff","Files within the slice + a summary."]],
  output:[
    ["components",false,"Components, hooks, types."],
    ["tests",false,"Component (RTL) + a11y (axe-core) tests."],
    ["stories",false,"Storybook stories for design-system components."],
    ["diff_summary",false,"PR-ready summary."]],
  gate:"TypeScript strict, ESLint, Stylelint and axe-core must all be clean; zero accessibility violations.",
  evaluation:[
    "TypeScript strict mode clean; ESLint + Stylelint clean.",
    "A11y violations = 0.",
    "No hardcoded colors / spacing — design tokens only.",
    "Template-driven content uses form-engine-core.",
    "Permissions consumed from server, not invented.",
    "Snapshot stability; queries by role / label preferred."],
  principles:[
    ["Tokens, not hex","All theming comes from design tokens."],
    ["Server owns permissions","The client renders gates, never invents them."],
    ["Accessible by default","Zero axe-core violations is the bar."]],
  specs:[
    ["Skill type","Generation"],["Version","0.1.0"],
    ["Status","draft · spec only"],["Source","built-from-scratch"],
    ["Invoked by","frontend-agent"],
    ["Triggers","apps/web/** · 'new screen' · 'component' · 'form'"],
    ["Required context","engineering-guidelines · rbac-rules · domain-glossary"],
    ["Output","code generation (no envelope)"]]
},

"workflow-engine": {

/* ---------- rendering ---------- */
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
}
function applyAccent(cat){
  const c = CATS[cat], r = document.documentElement.style;
  r.setProperty("--accent", c.accent);
  r.setProperty("--accent-2", c.accent2);
  r.setProperty("--accent-dim", rgba(c.accent, .13));
  r.setProperty("--accent-line", rgba(c.accent, .30));
  r.setProperty("--glow", rgba(c.accent, .06));
}

function buildSwitcher(active){
  const el = document.getElementById("switcher");
  const ai = ORDER.indexOf(active);
  let html = "";
  ORDER.forEach((slug, i) => {
    const s = SKILLS[slug];
    const cls = slug === active ? "stage active" : (i < ai ? "stage done" : "stage");
    html += '<button class="' + cls + '" data-slug="' + slug + '">' +
            '<span class="s-n">' + s.num + '</span> ' + s.short + '</button>';
    if (i < ORDER.length - 1) html += '<span class="arr">▸</span>';
  });
  el.innerHTML = html;
  el.querySelectorAll(".stage").forEach(b =>
    b.addEventListener("click", () => show(b.dataset.slug)));
}

function render(slug){
  const a = SKILLS[slug];
  const cat = CATS[a.cat];

  const meta = a.meta.map(m => '<span>' + m[0] + '&nbsp; <b>' + m[1] + '</b></span>').join("");
  const findings = a.specimen.findings.map(f =>
    '<div class="finding"><span class="tag' + (f.alt ? ' alt' : '') + '">' + f.tag +
    '</span><span class="txt">' + f.txt + '</span><span class="meta">' + f.meta + '</span></div>').join("");
  const overview = a.overview.map(p => '<p>' + p + '</p>').join("");
  const caps = a.caps.map(c =>
    '<div class="cap"><span class="cap-id">/ ' + c[0] + '</span><h3>' + c[1] + '</h3><p>' + c[2] + '</p></div>').join("");
  const steps = a.steps.map((s, i) =>
    '<div class="step"><div class="st-n">' + String(i+1).padStart(2,"0") +
    '</div><div><h3>' + s[0] + '</h3><p>' + s[1] + '</p></div></div>').join("");
  const fields = a.output.map(o =>
    '<div class="field"><span class="fname">' + (o[1] ? '<span class="br">' + o[0] + '</span>' : o[0]) +
    '</span><span class="fdesc">' + o[2] + '</span></div>').join("");
  const evals = a.evaluation.map(e =>
    '<div class="esc-row"><span class="to">✓</span>&nbsp; ' + e + '</div>').join("");
  const principles = a.principles.map(p =>
    '<div class="principle"><h3>' + p[0] + '</h3><p>' + p[1] + '</p></div>').join("");
  const specs = a.specs.map(s =>
    '<div class="spec-row"><dt>' + s[0] + '</dt><dd>' + s[1] + '</dd></div>').join("");

  const ni = (ORDER.indexOf(slug) + 1) % ORDER.length;
  const nextSlug = ORDER[ni];
  const next = SKILLS[nextSlug];
  const nextLabel = ni === 0 ? "Back to start ▸" : "Next skill";

  const runtimePill = a.runtime
    ? '<span class="pill accent">runtime-wired</span>'
    : '<span class="pill">spec only</span>';

  document.getElementById("app").innerHTML =
  '<section class="hero fade"><div class="wrap hero-grid"><div>' +
    '<p class="eyebrow">Skill ' + a.num + ' · ' + cat.label + '</p>' +
    '<h1>' + a.name + '</h1>' +
    '<div class="hero-status"><span class="pill">v0.1.0</span><span class="pill">draft</span>' + runtimePill +
      '<span class="pill accent">' + cat.label + '</span></div>' +
    '<p class="lede">' + a.lede + '</p>' +
    '<div class="hero-meta">' + meta + '</div>' +
  '</div>' +
    '<div class="scanner" aria-hidden="true"><div class="scanner-head">' +
      '<span class="tl"><i></i><i></i><i></i></span>' + a.specimen.file + '</div>' +
      '<div class="scan-body"><div class="scanline"></div><pre class="code">' + a.specimen.code + '</pre></div>' +
      '<div class="findings">' + findings + '</div>' +
    '</div>' +
  '</div></section>' +

  '<section class="section" id="what"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Overview</p><h2>What it does</h2></div>' +
    '<div class="prose">' + overview + '</div></div></section>' +

  '<section class="section" id="caps"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Capabilities</p><h2>What it produces</h2></div>' +
    '<div class="cap-grid">' + caps + '</div></div></section>' +

  '<section class="section" id="how"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Mechanics</p><h2>How it works</h2>' +
    '<p>From input to structured output, invoked by its owning agent.</p></div>' +
    '<div class="steps">' + steps + '</div></div></section>' +

  '<section class="section" id="output"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Deliverable</p><h2>The output</h2>' +
    '<p>Key fields of what the skill returns.</p></div>' +
    '<div class="schema">' + fields + '</div>' +
    '<div class="conf"><div class="meter">' +
      '<span class="seg on"></span><span class="seg on"></span><span class="seg on"></span>' +
      '<span class="seg on"></span><span class="seg on"></span><span class="seg on"></span>' +
      '<span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span></div>' +
      '<span class="conf-txt">Quality bar &mdash; ' + a.gate + '</span>' +
    '</div></div></section>' +

  '<section class="section"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Quality</p><h2>Evaluation criteria</h2>' +
    '<p>The bar a generated output must clear before it is trusted.</p></div>' +
    '<div class="esc-list">' + evals + '</div>' +
    '<p class="esc-note">All twelve skills are <b>v0.1.0 drafts</b> — per-skill <code>input-schema.json</code>, ' +
    '<code>output-schema.json</code>, worked examples, and eval datasets are still being seeded (each SKILL.md tracks its own TODO). ' +
    'Source of truth: <code>ai/REGISTRY.md</code>.</p></div></section>' +

  '<section class="section"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Operating principles</p><h2>The rules it works by</h2></div>' +
    '<div class="principles">' + principles + '</div></div></section>' +

  '<section class="section" id="specs"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Technical specifications</p><h2>At a glance</h2></div>' +
    '<dl class="specs">' + specs + '</dl></div></section>' +

  '<section class="next"><div class="wrap"><div class="next-card">' +
    '<div class="nx-l"><span class="label">' + nextLabel + '</span>' +
    '<h3>' + next.name + ' →</h3></div>' +
    '<button class="go" data-slug="' + nextSlug + '">Skill ' + next.num + '</button>' +
  '</div></div></section>';

  document.querySelector(".next-card .go").addEventListener("click", e => show(e.target.dataset.slug));
  document.getElementById("foot-pos").textContent = "Skill " + a.num + " / 12";
}

function show(slug){
  if (!SKILLS[slug]) slug = ORDER[0];
  applyAccent(SKILLS[slug].cat);
  buildSwitcher(slug);
  render(slug);
  if (location.hash.slice(1) !== slug) history.replaceState(null, "", "#" + slug);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1) || ORDER[0]);
</script>
