<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/Logo%20(2).png" />
<title>Agent Catalog — Client Onboarding Portal</title>
<meta name="description" content="The 11 specialist sub-agents of the Client Onboarding Portal AI pipeline — each with capabilities, mechanics, output envelope, escalation triggers, and specs.">

<style>
  :root {
    --ink:        #0B0B0D;
    --ink-2:      #111218;
    --surface:    #15171F;
    --surface-2:  #1B1E27;
    --line:       #2B2E38;
    --line-soft:  #20222B;
    --text:       #E7E3D6;
    --muted:      #A6A296;
    --faint:      #6E6A5E;

    /* accent — gold, matching the Discovery agent theme */
    --accent:     #F5C010;
    --accent-2:   #FFD43B;
    --accent-dim: rgba(245,192,16,.13);
    --accent-line:rgba(245,192,16,.30);
    --glow:       rgba(245,192,16,.07);

    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;

    --maxw: 1060px;
    --step: clamp(2.4rem, 6vw, 4.5rem);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(120% 80% at 80% -10%, var(--glow), transparent 55%),
      var(--ink);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background .4s ease;
  }

  ::selection { background: var(--accent-dim); color: var(--accent-2); }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .eyebrow {
    font-family: var(--font-mono); font-size: .72rem; letter-spacing: .22em;
    text-transform: uppercase; color: var(--accent); margin: 0;
  }
  .label {
    font-family: var(--font-mono); font-size: .68rem; letter-spacing: .18em;
    text-transform: uppercase; color: var(--faint);
  }
  h1, h2, h3 { text-wrap: balance; font-weight: 650; letter-spacing: -.02em; line-height: 1.08; }
  .mono { font-family: var(--font-mono); }

  /* ===== top bar ===== */
  .topbar {
    border-bottom: 1px solid var(--line-soft);
    position: sticky; top: 0; z-index: 20;
    background: rgba(11,11,13,.82); backdrop-filter: blur(10px);
  }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: .8rem; letter-spacing: .04em; color: var(--muted); }
  .brand b { color: var(--text); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: background .4s ease, box-shadow .4s ease; }
  .topbar nav { display: flex; gap: 22px; }
  .topbar nav a { color: var(--muted); font-family: var(--font-mono); font-size: .74rem; letter-spacing: .04em; }
  .topbar nav a:hover { color: var(--text); text-decoration: none; }
  @media (max-width: 760px){ .topbar nav { display: none; } }

  /* ===== switcher strip ===== */
  .pipeline { border-bottom: 1px solid var(--line-soft); background: var(--ink-2); }
  .pipeline .wrap { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding-top: 12px; padding-bottom: 12px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .pipeline .wrap::-webkit-scrollbar { height: 5px; }
  .pipeline .wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .stage {
    display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap;
    font-family: var(--font-mono); font-size: .76rem; color: var(--faint);
    padding: 5px 11px; border-radius: 999px; border: 1px solid transparent;
    cursor: pointer; background: none; transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .stage:hover { color: var(--text); }
  .stage .s-n { font-size: .66rem; opacity: .8; }
  .stage.active { color: var(--text); border-color: var(--accent-line); background: var(--accent-dim); }
  .stage.active .s-n { color: var(--accent); opacity: 1; }
  .stage.done { color: var(--muted); }
  .arr { color: var(--line); font-family: var(--font-mono); font-size: .7rem; }

  /* ===== hero ===== */
  .hero { padding: var(--step) 0 calc(var(--step) * .7); }
  .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; }
  @media (max-width: 920px){ .hero-grid { grid-template-columns: 1fr; gap: 36px; } }

  .hero h1 { font-size: clamp(2.4rem, 5.8vw, 3.9rem); margin: 16px 0 0; }
  .hero-status { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .pill {
    font-family: var(--font-mono); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 5px; border: 1px solid var(--line);
    color: var(--muted); background: var(--surface);
  }
  .pill.accent { color: var(--accent); border-color: var(--accent-line); background: var(--accent-dim); }
  .hero .lede { color: var(--muted); font-size: 1.1rem; max-width: 48ch; margin: 18px 0 0; }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 26px; font-family: var(--font-mono); font-size: .76rem; color: var(--muted); }
  .hero-meta span b { color: var(--text); font-weight: 600; }

  /* ---- specimen card ---- */
  .scanner { position: relative; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(180deg, var(--surface), var(--ink-2)); overflow: hidden; box-shadow: 0 24px 60px -30px rgba(0,0,0,.8); }
  .scanner-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); font-family: var(--font-mono); font-size: .71rem; color: var(--faint); }
  .tl { display: flex; gap: 6px; margin-right: 6px; }
  .tl i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
  .scan-body { position: relative; }
  pre.code { margin: 0; padding: 18px 18px 20px; font-family: var(--font-mono); font-size: .77rem; line-height: 1.7; color: #aeb9c5; overflow-x: auto; tab-size: 2; }
  pre.code .k { color: #ffcf6a; }
  pre.code .s { color: #88c9a1; }
  pre.code .c { color: #56616e; font-style: italic; }
  pre.code .f { color: #e4d290; }
  pre.code .n { color: #d8a0d8; }
  pre.code .x { color: #ff7a7a; }

  .scanline {
    position: absolute; left: 0; right: 0; top: 0; height: 38px;
    background: linear-gradient(180deg, transparent, var(--accent-dim) 70%, var(--accent-line));
    border-bottom: 1px solid var(--accent); box-shadow: 0 0 22px 2px var(--accent-dim);
    pointer-events: none; animation: sweep 5.6s cubic-bezier(.6,0,.4,1) infinite;
  }
  @keyframes sweep {
    0% { transform: translateY(-40px); opacity: 0; }
    8% { opacity: 1; } 70% { opacity: 1; }
    85% { transform: translateY(300px); opacity: 0; }
    100% { transform: translateY(300px); opacity: 0; }
  }

  .findings { border-top: 1px solid var(--line-soft); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--ink-2); }
  .finding { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: .72rem; padding: 8px 11px; border-radius: 7px; border: 1px solid var(--line-soft); background: var(--surface); opacity: 0; transform: translateX(8px); animation: pop .5s ease forwards; }
  .finding .tag { font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; color: var(--ink); background: var(--accent); font-weight: 700; flex-shrink: 0; }
  .finding .tag.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent-line); }
  .finding .txt { color: var(--text); }
  .finding .meta { margin-left: auto; color: var(--faint); flex-shrink: 0; }
  .finding:nth-child(1){ animation-delay: 1.0s; }
  .finding:nth-child(2){ animation-delay: 1.5s; }
  .finding:nth-child(3){ animation-delay: 2.0s; }
  .finding:nth-child(4){ animation-delay: 2.5s; }
  @keyframes pop { to { opacity: 1; transform: translateX(0); } }

  @media (prefers-reduced-motion: reduce) {
    .scanline { animation: none; opacity: .85; top: 110px; }
    .finding { animation: none; opacity: 1; transform: none; }
    body, .dot { transition: none; }
  }

  /* ===== section ===== */
  .section { padding: calc(var(--step) * .72) 0; border-top: 1px solid var(--line-soft); scroll-margin-top: 72px; }
  .section-head { max-width: 56ch; margin-bottom: 34px; }
  .section-head h2 { font-size: clamp(1.6rem, 3.2vw, 2.3rem); margin: 12px 0 0; }
  .section-head p { color: var(--muted); margin: 14px 0 0; }

  .prose p { color: var(--muted); max-width: 64ch; margin: 0 0 16px; }
  .prose strong { color: var(--text); font-weight: 600; }

  /* capability grid */
  .cap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }
  @media (max-width: 820px){ .cap-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 540px){ .cap-grid { grid-template-columns: 1fr; } }
  .cap { background: var(--surface); padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 8px; transition: background .18s ease; }
  .cap:hover { background: var(--surface-2); }
  .cap .cap-id { font-family: var(--font-mono); font-size: .68rem; color: var(--accent); letter-spacing: .08em; }
  .cap h3 { font-size: 1rem; margin: 0; }
  .cap p { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.5; }

  /* steps */
  .steps { display: flex; flex-direction: column; }
  .step { display: grid; grid-template-columns: 56px 1fr; gap: 20px; padding: 20px 0; border-top: 1px solid var(--line-soft); }
  .step:first-child { border-top: none; }
  .step .st-n { font-family: var(--font-mono); font-size: 1.4rem; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; padding-top: 2px; }
  .step h3 { font-size: 1.05rem; margin: 0 0 6px; }
  .step p { margin: 0; color: var(--muted); font-size: .93rem; max-width: 62ch; }

  /* output schema */
  .schema { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
  @media (max-width: 720px){ .schema { grid-template-columns: 1fr; } }
  .field { border: 1px solid var(--line-soft); border-radius: 9px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 5px; }
  .field .fname { font-family: var(--font-mono); font-size: .84rem; color: var(--text); }
  .field .fname .br { color: var(--accent); }
  .field .fdesc { font-size: .84rem; color: var(--muted); }

  .conf { margin-top: 24px; border: 1px solid var(--accent-line); border-radius: 10px; background: var(--accent-dim); padding: 16px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .conf .meter { display: flex; gap: 4px; }
  .conf .seg { width: 24px; height: 10px; border-radius: 2px; background: var(--line); }
  .conf .seg.on { background: var(--accent); }
  .conf .conf-txt { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }
  .conf .conf-txt b { color: var(--text); }

  /* escalation */
  .esc-list { display: flex; flex-direction: column; gap: 8px; }
  .esc-row { border-left: 2px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; padding: 12px 16px; font-family: var(--font-mono); font-size: .82rem; color: var(--text); }
  .esc-row .to { color: var(--accent); }
  .esc-note { margin-top: 18px; color: var(--faint); font-size: .85rem; max-width: 70ch; }
  .esc-note code { color: var(--muted); }

  /* principles */
  .principles { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
  @media (max-width: 720px){ .principles { grid-template-columns: 1fr; } }
  .principle { border-top: 2px solid var(--accent); padding-top: 14px; }
  .principle h3 { font-size: 1rem; margin: 0 0 7px; }
  .principle p { margin: 0; color: var(--muted); font-size: .89rem; }

  /* specs */
  .specs { border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }
  .spec-row { display: grid; grid-template-columns: 200px 1fr; border-top: 1px solid var(--line-soft); }
  .spec-row:first-child { border-top: none; }
  .spec-row dt { padding: 13px 18px; background: var(--ink-2); font-family: var(--font-mono); font-size: .74rem; letter-spacing: .03em; color: var(--muted); }
  .spec-row dd { margin: 0; padding: 13px 18px; color: var(--text); font-family: var(--font-mono); font-size: .8rem; word-break: break-word; }
  @media (max-width: 560px){ .spec-row { grid-template-columns: 1fr; } .spec-row dd { padding-top: 0; } }

  /* next */
  .next { border-top: 1px solid var(--line-soft); padding: var(--step) 0; }
  .next-card { display: flex; align-items: center; justify-content: space-between; gap: 20px; border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; background: var(--surface); flex-wrap: wrap; }
  .next-card .nx-l .label { display: block; margin-bottom: 6px; }
  .next-card h3 { font-size: 1.3rem; margin: 0; }
  .next-card button.go { font-family: var(--font-mono); font-size: .82rem; color: var(--accent); border: 1px solid var(--accent-line); border-radius: 8px; padding: 11px 18px; background: var(--accent-dim); cursor: pointer; transition: background .15s ease; }
  .next-card button.go:hover { background: var(--accent-line); }

  footer.foot { border-top: 1px solid var(--line-soft); padding: 26px 0 48px; color: var(--faint); font-family: var(--font-mono); font-size: .72rem; }
  footer.foot .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  /* ===== directory / index grid (catalog hub) ===== */
  .idx-phase { margin-top: 26px; }
  .idx-phase > .label { display: block; margin-bottom: 12px; padding-left: 2px; }
  .idx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }
  @media (max-width: 760px){ .idx-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 480px){ .idx-grid { grid-template-columns: 1fr; } }
  .idx-card { background: var(--surface); padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 5px; transition: background .16s ease; }
  .idx-card:hover { background: var(--surface-2); text-decoration: none; }
  .idx-card .ic-n { font-family: var(--font-mono); font-size: .68rem; color: var(--accent); letter-spacing: .1em; }
  .idx-card .ic-name { color: var(--text); font-weight: 600; font-size: .98rem; }
  .idx-card .ic-stage { font-family: var(--font-mono); font-size: .68rem; color: var(--faint); }
  .backtop { font-family: var(--font-mono); font-size: .7rem; color: var(--faint); margin: 4px 0 44px; display: inline-block; }

  .fade { animation: fadein .35s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  h1,h2,h3,h4{-webkit-user-select:none;user-select:none;cursor:default}
</style>
</head>

  <div class="wrap">
    <div class="bar-left" style="display:flex;align-items:center;gap:18px">
      <a href="/toolkit?cat=Onboarding%20Portal" style="display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:.8rem;font-weight:600;text-decoration:none;white-space:nowrap">← Back</a>
      <div class="brand"><span class="dot"></span> Onboarding&nbsp;Portal&nbsp;<b>· Agent Catalog</b></div>

<footer class="foot">
  <div class="wrap">
    <span>Generated from ai/agents/*.md + ai/REGISTRY.md · all agents draft / built-from-scratch</span>
    <span id="foot-pos">Agent 01 / 11</span>

<script>
/* ---------- category accents (collapsed to the gold theme) ---------- */
const GOLD = "#F5C010", GOLD2 = "#FFD43B";
const CATS = {
  design:    { label: "Design & Governance", accent: GOLD, accent2: GOLD2 },
  implement: { label: "Implementation",      accent: GOLD, accent2: GOLD2 },
  verify:    { label: "Verification",        accent: GOLD, accent2: GOLD2 },
  review:    { label: "Review (read-only)",  accent: GOLD, accent2: GOLD2 },
  docs:      { label: "Documentation",       accent: GOLD, accent2: GOLD2 },
};

/* ---------- agent data ---------- */
const ORDER = [
  "architecture-agent","backend-agent","frontend-agent","workflow-engine-agent",
  "rbac-agent","xlsx-integration-agent","testing-agent","reviewer-agent",
  "security-agent","audit-versioning-agent","documentation-agent"
];

const AGENTS = {

"architecture-agent": {
  num: "01", short: "Architecture", name: "Architecture Agent", cat: "design",
  runtime: true,
  lede: "It reads a design proposal the way a principal engineer reviews an RFC — pressure-testing it against the architecture principles, naming the bounded-context violations and hidden coupling, and refusing to approve what should have been an ADR.",
  meta: [["Tools","Read · Grep · Glob · Write · Edit"],["Access","docs & ADRs only"],["Output","verdict + ADRs (JSON)"]],
  specimen: {
    file: "docs/architecture/realtime-sync.md → review",
    code:
`<span class="c">## Proposal: live Smart-Client sync</span>
The xlsx module will call the cases
service <span class="x">directly</span> to write field values
on upload — <span class="x">bypassing the event bus</span>
for "lower latency".
<span class="c"># No ADR — treated as an impl detail.</span>`,
    findings: [
      {tag:"Concern", alt:false, txt:"Direct cross-module write · P7", meta:"BLOCKING"},
      {tag:"Concern", alt:false, txt:"Side-effect on request path", meta:"MAJOR"},
      {tag:"ADR", alt:true, txt:"latency vs. consistency", meta:"REQUIRED"},
      {tag:"Verdict", alt:true, txt:"approve_with_conditions", meta:"VERDICT"},
    ]
  },
  overview: [
    "Hand it a design brief or ADR draft and the Architecture Agent evaluates it against <strong>architecture-principles.md</strong> — bounded-context integrity, layered structure, event-driven boundaries, and whether the design can scale and evolve. It is read-only on application code: it produces designs, module structures, and ADRs, never implementation.",
    "Its discipline is to draft the decision record the change actually needs. Where a non-trivial choice is being made without an ADR, it stops and writes one — and where a change quietly crosses a bounded context or edits an already-accepted ADR, it refuses and <strong>escalates to a human architect</strong>."
  ],
  caps: [
    ["verdict","Design verdict","approve / reject / approve_with_conditions, with a rationale tied to a numbered principle."],
    ["concerns","Severity-tagged concerns","Each concern cites the principle it breaks, why it matters, and a concrete fix."],
    ["adr","Required ADRs","Drafts the missing decision records — context, decision, alternatives — to the repo template."],
    ["coupling","Coupling & boundaries","Detects cross-module imports, sync side-effects, and hidden coupling between contexts."],
    ["scalability","Scalability notes","Flags designs that won't scale or evolve, with the bottleneck made explicit."],
    ["impact","Module impact","Maps which bounded contexts the change touches and how."]
  ],
  steps: [
    ["Triggered","Fires on a design-review request, an architecture-review-requested PR label, or a major module-structure change spotted by the reviewer agent."],
    ["Loads the rules","Pulls architecture-principles, the domain glossary, and workflow-rules into a fresh context window."],
    ["Evaluates the design","Checks bounded-context integrity, layering, event boundaries, scalability — and whether each non-trivial decision has an ADR."],
    ["Drafts what's missing","Writes required ADRs to the template and proposes module boundaries; never edits an accepted ADR — supersedes it."],
    ["Emits the verdict","Returns the structured envelope; blocking concerns and cross-context coupling pause for a human architect."]
  ],
  output: [
    ["verdict",true,"approve | reject | approve_with_conditions."],
    ["strengths",false,"What the design gets right."],
    ["concerns",true,"severity · principle · issue · rationale · suggestion."],
    ["required_adrs",true,"title · context · decision_summary · alternatives."],
    ["module_impact",false,"Per-module impact of the change."],
    ["scalability_notes",false,"Forward-looking risks to scale & evolvability."]
  ],
  escalation: [
    ["Change crosses bounded contexts","pause; human architect approval"],
    ["Edit to an already-accepted ADR","stop; supersede with a new ADR only"],
    ["New top-level domain concept","human architect"],
    ["Scalability concern with no mitigation","architecture board"]
  ],
  principles: [
    ["Decisions get recorded","Non-trivial choices become ADRs — never buried as 'implementation details'."],
    ["Boundaries are sacred","No cross-context coupling slips through as a convenience."],
    ["Don't over-architect","Simple changes stay simple; ceremony is reserved for real decisions."]
  ],
  specs: [
    ["Pipeline stage","01 — Design & Governance"],
    ["Status","draft · runtime-wired (.claude/agents)"],
    ["Tools","Read · Grep · Glob · Write · Edit"],
    ["Write scope","docs/adr/** · docs/architecture/**"],
    ["Off-limits","apps/** · packages/** · infrastructure/** · ci/**"],
    ["Required context","architecture-principles · domain-glossary · workflow-rules"],
    ["Output","agent-output-contract envelope (JSON)"]
  ]
},

"backend-agent": {
  num: "02", short: "Backend", name: "Backend Agent", cat: "implement",
  runtime: false,
  lede: "It builds a feature inside one bounded context the way a careful service owner would — authorization at the door, audit inside the transaction, events on the outbox, and the full negative-path test matrix written before it calls the work done.",
  meta: [["Tools","Read · Edit · Write · Bash · +2"],["Access","apps/api · packages · tests"],["Output","files + events + tests"]],
  specimen: {
    file: "modules/cases/application/submit-case.ts (generated)",

/* ---------- rendering ---------- */
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
}
function applyAccent(cat){
  const c = CATS[cat], r = document.documentElement.style;
  r.setProperty("--accent", c.accent);
  r.setProperty("--accent-2", c.accent2);
  r.setProperty("--accent-dim", rgba(c.accent, .13));
  r.setProperty("--accent-line", rgba(c.accent, .30));
  r.setProperty("--glow", rgba(c.accent, .06));
}

function renderDirectory(){
  const groups = {};
  ORDER.forEach(slug => {
    const cat = AGENTS[slug].cat;
    (groups[cat] = groups[cat] || []).push(slug);
  });
  let phases = "";
  Object.keys(CATS).forEach(catKey => {
    const slugs = groups[catKey];
    if (!slugs || !slugs.length) return;
    const cards = slugs.map(slug => {
      const a = AGENTS[slug];
      return '<a class="idx-card" href="#' + slug + '">' +
             '<span class="ic-n">' + a.num + '</span>' +
             '<span class="ic-name">' + a.name + '</span>' +
             '<span class="ic-stage">' + slug + '</span></a>';
    }).join("");
    phases += '<div class="idx-phase"><span class="label">' + CATS[catKey].label +
              '</span><div class="idx-grid">' + cards + '</div></div>';
  });

  document.getElementById("app").innerHTML =
    '<section class="hero fade"><div class="wrap">' +
      '<p class="eyebrow">Agent Catalog · 11 agents · 5 categories</p>' +
      '<h1>The agents that onboard &amp; build the platform</h1>' +
      '<p class="lede">Eleven single-purpose engineering agents — from architecture and governance ' +
      'through implementation, verification, review, and documentation. Each runs in its own isolated ' +
      'context and hands a structured result to the next. Select one to see its golden rule, ' +
      'capabilities, mechanics, output schema, and guardrails.</p>' +
    '</div></section>' +
    '<section class="section" id="index"><div class="wrap">' +
      '<div class="section-head"><p class="eyebrow">Directory</p><h2>All 11 agents</h2>' +
      '<p>Grouped by role in the pipeline. Select any agent to view it in isolation.</p></div>' +
      phases +
    '</div></section>';
  document.getElementById("foot-pos").textContent = "11 agents";
  const navOverview = document.getElementById("nav-overview");
  if (navOverview) navOverview.style.display = "none";
  const navDirectory = document.getElementById("nav-directory");
  if (navDirectory) navDirectory.style.display = "none";
}

function render(slug){
  const a = AGENTS[slug];
  const cat = CATS[a.cat];

  const meta = a.meta.map(m => '<span>' + m[0] + '&nbsp; <b>' + m[1] + '</b></span>').join("");
  const findings = a.specimen.findings.map(f =>
    '<div class="finding"><span class="tag' + (f.alt ? ' alt' : '') + '">' + f.tag +
    '</span><span class="txt">' + f.txt + '</span><span class="meta">' + f.meta + '</span></div>').join("");
  // The "What it does" overview section is only shown for the Architecture Agent.
  const overviewSection = (slug === "architecture-agent")
    ? '<section class="section" id="what"><div class="wrap">' +
        '<div class="section-head"><p class="eyebrow">Overview</p><h2>What it does</h2></div>' +
        '<div class="prose">' + a.overview.map(p => '<p>' + p + '</p>').join("") + '</div></div></section>'
    : '';
  const caps = a.caps.map(c =>
    '<div class="cap"><span class="cap-id">/ ' + c[0] + '</span><h3>' + c[1] + '</h3><p>' + c[2] + '</p></div>').join("");
  const steps = a.steps.map((s, i) =>
    '<div class="step"><div class="st-n">' + String(i+1).padStart(2,"0") +
    '</div><div><h3>' + s[0] + '</h3><p>' + s[1] + '</p></div></div>').join("");
  const fields = a.output.map(o =>
    '<div class="field"><span class="fname">' + (o[1] ? '<span class="br">' + o[0] + '</span>' : o[0]) +
    '</span><span class="fdesc">' + o[2] + '</span></div>').join("");
  const esc = a.escalation.map(e =>
    '<div class="esc-row">' + e[0] + ' <span class="to">→ ' + e[1] + '</span></div>').join("");
  const principles = a.principles.map(p =>
    '<div class="principle"><h3>' + p[0] + '</h3><p>' + p[1] + '</p></div>').join("");
  const specs = a.specs.map(s =>
    '<div class="spec-row"><dt>' + s[0] + '</dt><dd>' + s[1] + '</dd></div>').join("");

  const runtimePill = a.runtime
    ? '<span class="pill accent">runtime-wired</span>'
    : '<span class="pill">spec only</span>';

  document.getElementById("app").innerHTML =
  '<section class="hero fade"><div class="wrap"><div>' +
    '<p class="eyebrow">Onboarding Portal · Stage ' + a.num + ' · ' + cat.label + '</p>' +
    '<h1>' + a.name + '</h1>' +
    '<div class="hero-status"><span class="pill">draft</span>' + runtimePill +
      '<span class="pill accent">' + cat.label + '</span></div>' +
    '<p class="lede">' + a.lede + '</p>' +
    '<div class="hero-meta">' + meta + '</div>' +
  '</div>' +
  '</div></section>' +

  overviewSection +

  '<section class="section" id="caps"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Capabilities</p><h2>What it produces</h2></div>' +
    '<div class="cap-grid">' + caps + '</div></div></section>' +

  '<section class="section" id="how"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Mechanics</p><h2>How it works</h2>' +
    '<p>From trigger to hand-off, in a fresh isolated context window.</p></div>' +
    '<div class="steps">' + steps + '</div></div></section>' +

  '<section class="section" id="output"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Deliverable</p><h2>The output</h2>' +
    '<p>Returned as the standard structured envelope; key fields below.</p></div>' +
    '<div class="schema">' + fields + '</div>' +
    '<div class="conf"><div class="meter">' +
      '<span class="seg on"></span><span class="seg on"></span><span class="seg on"></span>' +
      '<span class="seg on"></span><span class="seg on"></span><span class="seg on"></span>' +
      '<span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span></div>' +
      '<span class="conf-txt">Quality gate &mdash; <b>confidence_score &lt; 0.60</b> sets escalation_flag and pauses for human review.</span>' +
    '</div></div></section>' +

  '<section class="section"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Guardrails</p><h2>Escalation triggers</h2>' +
    '<p>When it stops and hands a decision to a human, instead of proceeding.</p></div>' +
    '<div class="esc-list">' + esc + '</div>' +
    '<p class="esc-note">Plus the <b>universal rules</b> every agent obeys: pause on any change to <code>docs/adr/</code>, ' +
    '<code>architecture-principles.md</code> or <code>rbac-rules.md</code>; a new FSM state or audit-event type; ' +
    'schema migrations, <code>infrastructure/</code> or <code>ci/</code>; a diff over ~500 lines; any CRITICAL/HIGH finding; ' +
    'or a coverage drop past threshold.</p></div></section>' +

  '<section class="section"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Operating principles</p><h2>The rules it works by</h2></div>' +
    '<div class="principles">' + principles + '</div></div></section>' +

  '<section class="section" id="specs"><div class="wrap">' +
    '<div class="section-head"><p class="eyebrow">Technical specifications</p><h2>At a glance</h2></div>' +
    '<dl class="specs">' + specs + '</dl></div></section>';

  // The Overview and Directory nav links only apply to the Architecture Agent.
  const isArch = (slug === "architecture-agent");
  const navOverview = document.getElementById("nav-overview");
  if (navOverview) navOverview.style.display = isArch ? "" : "none";
  const navDirectory = document.getElementById("nav-directory");
  if (navDirectory) navDirectory.style.display = isArch ? "" : "none";
  document.getElementById("foot-pos").textContent = "Agent " + a.num + " / 11";
}

function show(slug){
  if (!AGENTS[slug]) slug = ORDER[0];
  applyAccent(AGENTS[slug].cat);
  render(slug);
  if (location.hash.slice(1) !== slug) history.replaceState(null, "", "#" + slug);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showDirectory(){
  renderDirectory();
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// The directory grid is the hub. An agent slug in the hash opens that agent in
// isolation; an empty/#index hash returns to the directory. Other in-page anchors
// (#what, #caps, …) are left to scroll natively within the open agent.
function route(){
  const h = location.hash.slice(1);
  if (AGENTS[h]) show(h);
  else if (h === "" || h === "index" || h === "directory") showDirectory();
}
window.addEventListener("hashchange", route);
route();
</script>
